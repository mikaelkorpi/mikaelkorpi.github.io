<!DOCTYPE html>
<html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mikael — not here</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C2432B'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F0E6D3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Noto+Sans+Ethiopic&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:#C2432B;color:#F0E6D3;font-family:'Space Grotesk',sans-serif;text-align:center;padding:24px}
svg{width:150px;opacity:.9}
h1{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:clamp(26px,5vw,40px)}
a{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;color:#F0E6D3;text-decoration:none;border-bottom:1px solid #F0E6D3}

/* page transition */
.wipe{position:fixed;inset:0;background:var(--brick);z-index:200;transform:translateY(100%);pointer-events:none}
.wipe.in{animation:wipeIn .42s cubic-bezier(.7,0,.3,1) forwards}
.wipe.out{transform:translateY(0);animation:wipeOut .5s .05s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipeIn{to{transform:translateY(0)}}
@keyframes wipeOut{to{transform:translateY(-100%)}}
</style></head><body>
<svg id="f" viewBox="0 0 200 200" fill="none" stroke="#F2E9DC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg>
<h1>Nothing here.</h1>
<a href="index.html">back to the door</a>
<script>
const j=k=>(Math.random()-.5)*k,f=n=>n.toFixed(1);
const S=[[[64,64],[61,52],[64,42]],[[70,33],[80,26],[92,27],[102,24]],[[108,25],[120,29],[133,38],[138,56]],
[[66,70],[64,84],[72,100],[86,112]],[[90,114],[100,115],[110,111]],[[135,72],[134,88],[128,100]],
[[104,64],[102,78],[100,92],[93,94]],[[78,66],[85,62],[92,64]],
[[80,74],[86,70],[92,74],[86,77],[80,74]],[[112,60],[119,57],[125,59]],
[[114,70],[118,66],[122,70],[118,74],[114,70]],[[93,104],[100,106],[108,102]],
[[97,117],[96,124],[95,131]],[[46,186],[56,156],[74,141],[94,136]],[[114,136],[132,142],[148,158],[154,186]]];
const path=p=>{const q=p.map(([x,y])=>[x+j(3),y+j(3)]);let d=`M${f(q[0][0])},${f(q[0][1])}`,i=1;
for(;i+2<q.length;i+=3)d+=` C${f(q[i][0])},${f(q[i][1])} ${f(q[i+1][0])},${f(q[i+1][1])} ${f(q[i+2][0])},${f(q[i+2][1])}`;
const r=q.length-i;if(r===1)d+=` L${f(q[i][0])},${f(q[i][1])}`;if(r===2)d+=` Q${f(q[i][0])},${f(q[i][1])} ${f(q[i+1][0])},${f(q[i+1][1])}`;return d;};
document.getElementById('f').innerHTML=S.map(p=>`<path d="${path(p)}"/>`).join('')
+`<circle cx="86" cy="74" r="3.2" fill="#F2E9DC"/><circle cx="118" cy="70" r="2.8" fill="#F2E9DC"/>`;
</script><script>
/* page transition: brick sweeps across, then the next page reveals under it */
(function(){
  const w=document.createElement('div');w.className='wipe out';document.body.appendChild(w);
  addEventListener('pageshow',e=>{if(e.persisted){w.className='wipe out';}});
  document.addEventListener('click',e=>{
    const a=e.target.closest('a');
    if(!a)return;
    const href=a.getAttribute('href')||'';
    if(a.target==='_blank'||href.startsWith('http')||href.startsWith('mailto')||href.startsWith('#')||e.metaKey||e.ctrlKey)return;
    e.preventDefault();
    w.className='wipe in';
    setTimeout(()=>location.href=href,400);
  });
})();
/* the light shifts through the day */
(function(){
  const h=new Date().getHours();
  const warm = h>=19||h<7 ? '#EDE0C9' : h>=16 ? '#F0E5D0' : '#F0E6D3';
  document.documentElement.style.setProperty('--bone',warm);
})();
</script>
</body></html>
