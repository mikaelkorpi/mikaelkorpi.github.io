<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mikael</title>
<meta name="description" content="Recruiter, builder, and the rest of it. Helsinki.">
<meta property="og:title" content="mikael">
<meta property="og:description" content="Recruiter, builder, and the rest of it. Helsinki.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#C2432B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23C2432B%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23F0E6D3%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brick:#C2432B;
  --bone:#F0E6D3;
  --ink:#1A1310;
  --line:rgba(240,230,211,0.14);
  --line-dark:rgba(26,19,16,0.10);
  --font-g:'Space Grotesk',system-ui,sans-serif;
  --font-e:'Noto Sans Ethiopic',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-g);background:var(--brick);color:var(--bone);position:relative}

.identity{
  position:fixed;top:18px;left:20px;z-index:30;display:flex;
  font-weight:500;font-size:17px;letter-spacing:0.16em;text-transform:lowercase;
  color:var(--bone);text-decoration:none;transition:color .3s ease;
}
body.dark-tl .identity{color:var(--brick)}
.identity span{display:inline-block;position:relative;opacity:0;transform:translateY(10px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
.identity span:nth-child(1){animation-delay:.05s}.identity span:nth-child(2){animation-delay:.12s}
.identity span:nth-child(3){animation-delay:.19s}.identity span:nth-child(4){animation-delay:.26s}
.identity span:nth-child(5){animation-delay:.33s}.identity span:nth-child(6){animation-delay:.40s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.identity .seed{position:absolute;left:50%;top:3.5px;width:2.4px;height:2.4px;border-radius:50%;background:var(--brick);transform:translateX(-50%);box-shadow:0 0 0 1.2px var(--bone);transition:box-shadow .3s ease,background .3s ease}
body.dark-tl .identity .seed{background:var(--ink);box-shadow:0 0 0 1.2px var(--bone)}
.identity:hover span{animation:wave .9s ease-in-out}
.identity:hover span:nth-child(1){animation-delay:0s}.identity:hover span:nth-child(2){animation-delay:.06s}
.identity:hover span:nth-child(3){animation-delay:.12s}.identity:hover span:nth-child(4){animation-delay:.18s}
.identity:hover span:nth-child(5){animation-delay:.24s}.identity:hover span:nth-child(6){animation-delay:.30s}
@keyframes wave{0%,100%{transform:translateY(0);opacity:1}35%{transform:translateY(-5px);opacity:1}70%{transform:translateY(2px);opacity:1}}

.numeral{position:fixed;top:14px;right:22px;z-index:30;font-family:var(--font-e);font-size:20px;color:var(--bone);opacity:.75;transition:color .3s ease}
body.dark-tr .numeral{color:var(--ink)}

.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1600px}
.board{
  position:relative;display:grid;
  grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  width:min(92vw,92vh);height:min(92vw,92vh);
  transform-style:preserve-3d;
  transition:width 1.1s cubic-bezier(.7,0,.2,1),height 1.1s cubic-bezier(.7,0,.2,1);
}
body.open .board{width:100vw;height:100vh}

.cell{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.6,0,.2,1)}
.cell.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{border:.5px solid var(--line)}
.face.front .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(240,230,211,.35);top:-1.5px;left:-1.5px;transition:transform 1.4s ease,background 1.4s ease}
.face.front .dot.twinkle{transform:scale(2.2);background:var(--bone)}
.face.back{
  transform:rotateY(180deg);background:var(--bone);border:.5px solid var(--line-dark);
  transition:border-color .8s ease 1.3s;
}
body.open .face.back{border-color:transparent}

/* four hand-drawn enclosures — same line as the portrait */
.constellation{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .9s ease}
body.ready .constellation{opacity:1;pointer-events:auto}
.blob{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;z-index:2;
  transition:transform .35s cubic-bezier(.34,1.4,.64,1)}
.blob:hover{transform:translateY(-5px) rotate(-1deg)}
.blob svg.shape{position:absolute;inset:-8%;width:116%;height:116%;overflow:visible;pointer-events:none}
.blob svg.shape path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 1.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.blob .inner{position:relative;z-index:2;text-align:center;pointer-events:none}
.blob .lbl{display:block;font-weight:700;letter-spacing:-.01em;text-transform:lowercase;line-height:.95}
.blob .tag{display:block;font-family:var(--font-m);font-size:10px;letter-spacing:.06em;text-transform:lowercase;margin-top:9px;opacity:.7}
.blob .num{position:absolute;font-family:var(--font-e);font-size:15px;opacity:.55;z-index:2;pointer-events:none}
.blob.fill{color:var(--bone)}
.blob.line{color:var(--ink)}
.blob.fill .num{top:12%;right:16%}
.blob.line .num{top:10%;right:14%}
.wire{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wire line{stroke:var(--brick);stroke-width:1;stroke-dasharray:2000;stroke-dashoffset:2000;animation:wirein .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes wirein{to{stroke-dashoffset:0}}

/* the figure — the one that worked */
.figure-wrap{
  position:absolute;left:25%;top:25%;width:50%;height:50%;
  display:flex;align-items:center;justify-content:center;
  z-index:15;cursor:pointer;transition:transform .3s ease-out;
}
.figure-wrap svg{width:78%;height:78%;animation:breathe 6s 1.6s ease-in-out infinite;transform-origin:50% 60%}
.figure-wrap svg .stroke{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.figure-wrap svg .pupil{opacity:0;animation:blink .3s ease forwards}
@keyframes blink{to{opacity:1}}
.figure-wrap.gone svg .pupil{animation:fadeout .3s ease forwards !important}
@keyframes fadeout{to{opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.figure-wrap.gone svg .stroke{animation:undraw .5s cubic-bezier(.6,0,.8,.2) forwards !important}
@keyframes undraw{to{stroke-dashoffset:-300}}
.figure-wrap.gone{pointer-events:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* page transition */
.wipe{position:fixed;inset:0;background:var(--brick);z-index:200;transform:translateY(100%);pointer-events:none}
.wipe.in{animation:wipeIn .42s cubic-bezier(.7,0,.3,1) forwards}
.wipe.out{transform:translateY(0);animation:wipeOut .5s .05s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipeIn{to{transform:translateY(0)}}
@keyframes wipeOut{to{transform:translateY(-100%)}}
</style>
</head>
<body>

<a class="identity" href="index.html"><span>m</span><span>ı<i class="seed"></i></span><span>k</span><span>a</span><span>e</span><span>l</span></a>
<div class="numeral" aria-label="1">፩</div>

<div class="stage"><div class="board" id="board"></div></div>

<script>
const board=document.getElementById('board');
const cells=[],dots=[];
for(let i=0;i<16;i++){
  const c=document.createElement('div');c.className='cell';
  const f=document.createElement('div');f.className='face front';
  const d=document.createElement('div');d.className='dot';f.appendChild(d);dots.push(d);
  const b=document.createElement('div');b.className='face back';
  c.appendChild(f);c.appendChild(b);board.appendChild(c);cells.push(c);
}

function twinkle(){
  const d=dots[Math.floor(Math.random()*dots.length)];
  d.classList.add('twinkle');
  setTimeout(()=>d.classList.remove('twinkle'),1600+Math.random()*1200);
  setTimeout(twinkle,700+Math.random()*1800);
}
setTimeout(twinkle,1400);

/* four hand-drawn enclosures, asymmetric layout */
const SLABS=[
  {href:'work.html',label:'work',tag:'recruiting · founding',num:'\u1372',x:8,y:14,w:38,h:34,size:'clamp(30px,5.4vmin,58px)',cls:'fill'},
  {href:'vibecode.html',label:'code',tag:'building things',num:'\u1373',x:54,y:10,w:26,h:22,size:'clamp(22px,3.6vmin,38px)',cls:'line'},
  {href:'medium.html',label:'medium',tag:'sound · image · objects',num:'\u1374',x:50,y:44,w:34,h:30,size:'clamp(24px,4.2vmin,44px)',cls:'fill'},
  {href:'thoughts.html',label:'thoughts',tag:'writing',num:'\u1375',x:14,y:58,w:28,h:22,size:'clamp(20px,3.2vmin,34px)',cls:'line'},
];
/* an irregular closed shape, drawn like a marker loop around a rectangle */
function blobPath(w,h,wob){
  const cx=w/2,cy=h/2,rx=w*.44,ry=h*.42,n=14;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const k=1+(Math.random()-.5)*wob;
    const sq=.72; // pull toward a rounded rectangle
    const px=cx+Math.sign(Math.cos(a))*Math.pow(Math.abs(Math.cos(a)),sq)*rx*k;
    const py=cy+Math.sign(Math.sin(a))*Math.pow(Math.abs(Math.sin(a)),sq)*ry*k;
    pts.push([px,py]);
  }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0=pts[i],p1=pts[(i+1)%n],p2=pts[(i+2)%n];
    const c1=[p0[0]+(p1[0]-pts[(i-1+n)%n][0])/5,p0[1]+(p1[1]-pts[(i-1+n)%n][1])/5];
    const c2=[p1[0]-(p2[0]-p0[0])/5,p1[1]-(p2[1]-p0[1])/5];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
  }
  return d+' Z';
}
const constel=document.createElement('div');constel.className='constellation';
const wire=document.createElementNS('http://www.w3.org/2000/svg','svg');wire.setAttribute('class','wire');
const wm=document.querySelector('.identity');
SLABS.forEach((o,i)=>{
  const a=document.createElement('a');a.className='blob '+o.cls;a.href=o.href;
  a.style.left=o.x+'%';a.style.top=o.y+'%';a.style.width=o.w+'%';a.style.height=o.h+'%';
  const W=400,H=Math.round(400*o.h/o.w);
  const fill=o.cls==='fill'?'#C2432B':'none';
  const stroke=o.cls==='fill'?'#C2432B':'#C2432B';
  const sw=o.cls==='fill'?6:3.2;
  a.innerHTML=`<svg class="shape" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${blobPath(W,H,.09)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" style="animation-delay:${(.1+i*.16).toFixed(2)}s"/>
      ${o.cls==='line'?`<path d="${blobPath(W,H,.12)}" fill="none" stroke="#C2432B" stroke-width="1.2" opacity=".45" stroke-linejoin="round" style="animation-delay:${(.5+i*.16).toFixed(2)}s"/>`:''}
    </svg>
    <span class="num">${o.num}</span>
    <span class="inner"><span class="lbl" style="font-size:${o.size}">${o.label}</span><span class="tag">${o.tag}</span></span>`;
  a.addEventListener('pointerenter',()=>{
    const r=a.getBoundingClientRect(),w=wm.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const tx=w.right,ty=w.top+w.height/2;
    const dx=tx-cx,dy=ty-cy,len=Math.hypot(dx,dy)||1;
    const hw=r.width/2,hh=r.height/2;
    const t=Math.min(Math.abs(dx)>1e-6?hw/Math.abs(dx/len):Infinity,
                     Math.abs(dy)>1e-6?hh/Math.abs(dy/len):Infinity);
    wire.innerHTML=`<line x1="${cx+dx/len*t}" y1="${cy+dy/len*t}" x2="${tx}" y2="${ty}"/>`;
  });
  a.addEventListener('pointerleave',()=>{wire.innerHTML='';});
  constel.appendChild(a);
});
constel.appendChild(wire);
board.appendChild(constel);

const fig=document.createElement('div');fig.className='figure-wrap';
/* broken strokes: each is a short bezier chain; gaps and overshoots are intentional */
const STROKES=[
  // hair — short broken bumps, five passes with gaps
  [[64,64],[61,52],[64,42]],
  [[68,34],[74,29],[80,27]],
  [[86,25],[91,28],[97,24],[102,27]],
  [[108,24],[115,26],[122,30]],
  [[128,34],[135,42],[139,52],[138,62]],
  // left side of face down to chin
  [[66,70],[64,82],[70,96],[82,108]],
  [[88,113],[95,115],[104,114],[112,110]],
  // right side, shorter, doesn't meet the chin
  [[135,72],[134,86],[128,98]],
  // picasso nose — one profile line through a frontal face
  [[104,64],[103,74],[101,84],[100,92],[93,94]],
  [[93,94],[95,97],[99,97]],
  // left eyebrow + almond eye
  [[77,66],[84,62],[92,64]],
  [[79,74],[85,70],[92,74],[86,77],[80,74]],
  // right eyebrow + circle eye, higher and smaller
  [[110,60],[117,57],[125,59]],
  [[114,70],[118,66],[122,70],[118,74],[114,70]],
  // mouth — slanted
  [[93,104],[100,106],[108,102]],
  // neck
  [[97,117],[96,124],[95,131]],
  [[112,113],[113,120],[114,128]],
  // shoulders — uneven
  [[46,186],[56,156],[74,141],[94,136]],
  [[114,136],[132,142],[148,158],[154,186]],
];
const DOTS=[[86,74,1.6],[118,70,1.4]];
const jit=()=> (Math.random()-.5)*2.2;
function toPath(pts){
  const q=pts.map(([x,y])=>[x+jit(),y+jit()]);
  const f=n=>n.toFixed(1);
  let d=`M${f(q[0][0])},${f(q[0][1])}`;
  let i=1;
  for(;i+2<q.length;i+=3)d+=` C${f(q[i][0])},${f(q[i][1])} ${f(q[i+1][0])},${f(q[i+1][1])} ${f(q[i+2][0])},${f(q[i+2][1])}`;
  const rem=q.length-i;
  if(rem===1)d+=` L${f(q[i][0])},${f(q[i][1])}`;
  if(rem===2)d+=` Q${f(q[i][0])},${f(q[i][1])} ${f(q[i+1][0])},${f(q[i+1][1])}`;
  return d;
}
const main=STROKES.map((pts,i)=>`<path class="stroke" style="animation-delay:${(.15+i*.09).toFixed(2)}s" d="${toPath(pts)}"/>`).join('')
  +DOTS.map(([x,y,r],i)=>`<circle class="pupil" style="animation-delay:${(1.2+i*.15).toFixed(2)}s" cx="${(x+jit()*.5).toFixed(1)}" cy="${(y+jit()*.5).toFixed(1)}" r="${r}" fill="#F2E9DC" stroke="none"/>`).join('');
const ghost=STROKES.filter((_,i)=>i<5||i>=17).map((pts,i)=>`<path class="stroke" style="animation-delay:${(1.9+i*.06).toFixed(2)}s;animation-duration:1s" d="${toPath(pts)}"/>`).join('');
fig.innerHTML=`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#F2E9DC" stroke-linejoin="round" stroke-linecap="round">
  <g stroke-width="1.1" opacity=".3" transform="translate(1.6,-1.2) rotate(-1.5 100 100)">${ghost}</g>
  <g stroke-width="1.6">${main}</g>
</svg>`;
fig.addEventListener('click',dissolve);
board.appendChild(fig);

let opened=false;
const pupils=[...fig.querySelectorAll('.pupil')];
const pupilHome=pupils.map(p=>[+p.getAttribute('cx'),+p.getAttribute('cy')]);
document.addEventListener('pointermove',e=>{
  if(opened)return;
  const dx=(e.clientX/window.innerWidth-.5),dy=(e.clientY/window.innerHeight-.5);
  fig.style.transform=`translate(${(dx*-8).toFixed(1)}px,${(dy*-8).toFixed(1)}px)`;
  pupils.forEach((p,i)=>{
    p.setAttribute('cx',(pupilHome[i][0]+dx*4.5).toFixed(2));
    p.setAttribute('cy',(pupilHome[i][1]+dy*3.2).toFixed(2));
  });
});

const order=cells.map((_,i)=>{
  const col=i%4,row=Math.floor(i/4),dx=col-1.5,dy=row-1.5;
  return {i,d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)};
}).sort((p,q)=>p.d-q.d||p.a-q.a).map(o=>o.i);

function dissolve(){
  if(opened)return;opened=true;
  fig.classList.add('gone');
  setTimeout(()=>document.body.classList.add('open'),300);
  order.forEach((idx,k)=>{
    const t=420+k*70;
    setTimeout(()=>cells[idx].classList.add('flip'),t);
    if(idx===0)setTimeout(()=>document.body.classList.add('dark-tl'),t+330);
    if(idx===3)setTimeout(()=>document.body.classList.add('dark-tr'),t+330);
  });
  setTimeout(()=>document.body.classList.add('ready'),420+order.length*70+500);
}
</script>
<script>
/* page transition: brick sweeps across, then the next page reveals under it */
(function(){
  const w=document.createElement('div');w.className='wipe out';document.body.appendChild(w);
  addEventListener('pageshow',e=>{if(e.persisted){w.className='wipe out';}});
  document.addEventListener('click',e=>{
    const a=e.target.closest('a');
    if(!a)return;
    const href=a.getAttribute('href')||'';
    if(a.target==='_blank'||href.startsWith('http')||href.startsWith('mailto')||href.startsWith('#')||e.metaKey||e.ctrlKey)return;
    e.preventDefault();
    w.className='wipe in';
    setTimeout(()=>location.href=href,400);
  });
})();
/* the light shifts through the day */
(function(){
  const h=new Date().getHours();
  const warm = h>=19||h<7 ? '#EDE0C9' : h>=16 ? '#F0E5D0' : '#F0E6D3';
  document.documentElement.style.setProperty('--bone',warm);
})();
</script>
</body>
</html>
